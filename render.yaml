services:
  - type: web
    name: nyc311-api
    runtime: python
    buildCommand: pip install -r requirements-api.txt && python scripts/setup_render.py
    startCommand: python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
